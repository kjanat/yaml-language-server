name: Package preview

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify distributable CLI
        run: npm run verify-package

      - name: Publish preview package
        run: npm exec -- pkg-pr-new publish --no-compact --bin --previewVersion --commentWithSha
