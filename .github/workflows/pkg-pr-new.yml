name: Package preview

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify distributable CLI
        run: npm run verify-package

      - name: Publish preview package
        run: npx -y pkg-pr-new publish --no-compact --bin --previewVersion --commentWithSha
